name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish assets to (optional, defaults to latest release tag)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: nyano-linux-glibc-x86_64
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: nyano-linux-musl-x86_64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: nyano-linux-glibc-aarch64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_name: nyano-linux-musl-aarch64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: nyano-macos-x86_64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: nyano-macos-aarch64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.cargo/bin
          gh release download -R cross-rs/cross --pattern "cross-x86_64-unknown-linux-musl.tar.gz" -O - | tar -xz -C ~/.cargo/bin
          chmod +x ~/.cargo/bin/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare binary and checksum
        run: |
          cp target/${{ matrix.target }}/release/nyano ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset_name }} | awk '{print $1}' > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} | awk '{print $1}' > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          retention-days: 1

  publish:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release tag, version and version_number
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"

          # Compute 1-based index of the tag by creation date
          NUM=$(git tag --sort=creatordate | grep -nx "${TAG}" | cut -d: -f1)
          if [ -z "$NUM" ] || [ "$NUM" -le 0 ]; then
            NUM=$(git tag -l | wc -l)
          fi
          if [ -z "$NUM" ] || [ "$NUM" -le 0 ]; then
            NUM=1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_number=${NUM}" >> "$GITHUB_OUTPUT"

      - name: Generate lacie.toml
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          VERSION_NUMBER="${{ steps.ver.outputs.version_number }}"
          SHA_LINUX_GLIBC_X86_64=$(cat artifacts/nyano-linux-glibc-x86_64.sha256)
          SHA_LINUX_MUSL_X86_64=$(cat artifacts/nyano-linux-musl-x86_64.sha256)
          SHA_LINUX_GLIBC_AARCH64=$(cat artifacts/nyano-linux-glibc-aarch64.sha256)
          SHA_LINUX_MUSL_AARCH64=$(cat artifacts/nyano-linux-musl-aarch64.sha256)
          SHA_MACOS_X86_64=$(cat artifacts/nyano-macos-x86_64.sha256)
          SHA_MACOS_AARCH64=$(cat artifacts/nyano-macos-aarch64.sha256)

          cat << EOF > artifacts/lacie.toml
          [workspace]
          author = "shareui"
          version = "${VERSION}"
          version_number = ${VERSION_NUMBER}
          source_code = "https://github.com/shareui/nyano"
          links = ["https://github.com/shareui/nyano"]

          [packages."de.shareui.nyano"]
          name = "nyano"

          [packages."de.shareui.nyano".binaries."linux-gnu-x86_64"]
          file = "nyano-linux-glibc-x86_64"
          sha256 = "${SHA_LINUX_GLIBC_X86_64}"

          [packages."de.shareui.nyano".binaries."linux-musl-x86_64"]
          file = "nyano-linux-musl-x86_64"
          static = true
          sha256 = "${SHA_LINUX_MUSL_X86_64}"

          [packages."de.shareui.nyano".binaries."linux-gnu-aarch64"]
          file = "nyano-linux-glibc-aarch64"
          sha256 = "${SHA_LINUX_GLIBC_AARCH64}"

          [packages."de.shareui.nyano".binaries."linux-musl-aarch64"]
          file = "nyano-linux-musl-aarch64"
          static = true
          sha256 = "${SHA_LINUX_MUSL_AARCH64}"

          [packages."de.shareui.nyano".binaries."macos-x86_64"]
          file = "nyano-macos-x86_64"
          sha256 = "${SHA_MACOS_X86_64}"

          [packages."de.shareui.nyano".binaries."macos-aarch64"]
          file = "nyano-macos-aarch64"
          sha256 = "${SHA_MACOS_AARCH64}"
          EOF

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release upload "${TAG}" \
            artifacts/nyano-linux-glibc-x86_64 \
            artifacts/nyano-linux-musl-x86_64 \
            artifacts/nyano-linux-glibc-aarch64 \
            artifacts/nyano-linux-musl-aarch64 \
            artifacts/nyano-macos-x86_64 \
            artifacts/nyano-macos-aarch64 \
            artifacts/lacie.toml \
            --clobber
